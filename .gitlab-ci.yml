include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml

image:
  name: hashicorp/terraform:${TF_VERSION}
  entrypoint: [""]
variables:
  TF_VERSION: "1.13"
  CHECKOV_VERSION: "3.2.500"
  TRIVY_VERSION: "0.69.1"

stages:
  - validate
  - security
  - infra_plan
  - infra_apply
  - config_plan
  - config_apply
  - destroy

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - infra/.terraform/
    - config/.terraform/
  policy: pull-push

.terraform_simple: &terraform_simple
  before_script:
    - terraform --version

.terraform_base: &terraform_base
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: ${AWS_AUD}
  before_script:
    - apk add --no-cache aws-cli
    - >
      KREDS=$(aws sts assume-role-with-web-identity
      --role-arn "${AWS_ROLE_ARN}"
      --role-session-name "GitLabJob-${CI_JOB_ID}"
      --web-identity-token "${GITLAB_OIDC_TOKEN}"
      --query "Credentials.[AccessKeyId,SecretAccessKey,SessionToken]"
      --output text)
    - |
      if [ -z "$KREDS" ]; then echo "ERROR: Failed to assume role"; exit 1; fi
      export AWS_ACCESS_KEY_ID=$(echo $KREDS | awk '{print $1}')
      export AWS_SECRET_ACCESS_KEY=$(echo $KREDS | awk '{print $2}')
      export AWS_SESSION_TOKEN=$(echo $KREDS | awk '{print $3}')
    - aws sts get-caller-identity

terraform_fmt_infra:
  stage: validate
  <<: *terraform_simple
  script:
    - cd infra
    - terraform fmt -check -recursive -diff
  allow_failure: false

terraform_fmt_config:
  stage: validate
  <<: *terraform_simple
  script:
    - cd config
    - terraform fmt -check -recursive -diff
  allow_failure: false

terraform_validate_infra:
  stage: validate
  <<: *terraform_base
  script:
    - cd infra
    - terraform init -backend-config="bucket=${TF_STATE_BUCKET}" -input=false -upgrade
    - terraform validate
  dependencies: []

terraform_validate_config:
  stage: validate
  <<: *terraform_base
  script:
    - cd config
    - terraform init -backend-config="bucket=${TF_STATE_BUCKET}" -input=false -upgrade
    - terraform validate
  dependencies: []


secret_detection:
  stage: security

trivy_scan_infra:
  stage: security
  image: 
    name: aquasec/trivy:${TRIVY_VERSION}
    entrypoint: [""]
  script:
    - cd infra
    - trivy config . --format json --output trivy-report.json
    - trivy config . --format sarif --output trivy-report.sarif
    - trivy config .
  artifacts:
    reports:
      sast: infra/trivy-report.sarif
    paths:
      - infra/trivy-report.json
    expire_in: 1 week
  allow_failure: false

trivy_scan_config:
  stage: security
  image: 
    name: aquasec/trivy:${TRIVY_VERSION}
    entrypoint: [""]
  script:
    - cd config
    - trivy config . --format json --output trivy-report.json
    - trivy config . --format sarif --output trivy-report.sarif
    - trivy config .
  artifacts:
    reports:
      sast: config/trivy-report.sarif
    paths:
      - config/trivy-report.json
    expire_in: 1 week
  allow_failure: false

checkov_scan_infra:
  stage: security
  image: 
    name: bridgecrew/checkov:${CHECKOV_VERSION}
    entrypoint: [""]
  script:
    - cd infra
    - >
      checkov -d . 
      --framework terraform 
      --download-external-modules true 
      --soft-fail 
      --output json 
      --output sarif 
      --output-file-path . 
      > /dev/null 2>&1
    - mv results_json.json checkov-report.json || true
    - mv results_sarif.sarif checkov-report.sarif || true
    - checkov -d . --framework terraform --quiet --compact
  artifacts:
    reports:
      sast: infra/checkov-report.sarif
    paths:
      - infra/checkov-report.json
    expire_in: 1 week
  allow_failure: false

checkov_scan_config:
  stage: security
  image: 
    name: bridgecrew/checkov:${CHECKOV_VERSION}
    entrypoint: [""]
  script:
    - cd config
    - >
      checkov -d .
      --framework terraform 
      --download-external-modules true 
      --soft-fail 
      --output json 
      --output sarif 
      --output-file-path . 
      > /dev/null 2>&1
    - mv results_json.json checkov-report.json || true
    - mv results_sarif.sarif checkov-report.sarif || true
    - checkov -d . --framework terraform --quiet --compact
  artifacts:
    reports:
      sast: config/checkov-report.sarif
    paths:
      - config/checkov-report.json
    expire_in: 1 week
  allow_failure: false


terraform_plan_infra:
  stage: infra_plan
  <<: *terraform_base
  script:
    - cd infra
    - terraform init -backend-config="bucket=${TF_STATE_BUCKET}" -input=false -upgrade
    - terraform plan -out=tfplan -input=false
  artifacts:
    name: terraform-plan-infra
    paths:
      - infra/tfplan
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

terraform_apply_infra:
  stage: infra_apply
  <<: *terraform_base
  script:
    - cd infra
    - terraform init -backend-config="bucket=${TF_STATE_BUCKET}" -input=false
    - terraform apply -input=false tfplan
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"
      when: manual
    - when: never

terraform_plan_config:
  stage: config_plan
  <<: *terraform_base
  script:
    - cd config
    - terraform init -backend-config="bucket=${TF_STATE_BUCKET}" -input=false
    - terraform plan -out=tfplan -input=false
  artifacts:
    name: terraform-plan-config
    paths:
      - config/tfplan
    expire_in: 1 week
  needs:
    - job: terraform_apply_infra
      optional: true
  tags:
    - private-vpc-runner
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: on_success
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"
      when: on_success
    - if: $CI_COMMIT_BRANCH != "main" && $CI_COMMIT_BRANCH != "master"
      when: manual
    - when: never

terraform_apply_config:
  stage: config_apply
  <<: *terraform_base
  script:
    - cd config
    - terraform init -backend-config="bucket=${TF_STATE_BUCKET}" -input=false
    - terraform apply -input=false tfplan
  needs:
    - job: terraform_plan_config
  tags:
    - private-vpc-runner
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"
      when: manual
    - when: never


terraform_destroy_config:
  stage: destroy
  <<: *terraform_base
  script:
    - cd config
    - terraform init -backend-config="bucket=${TF_STATE_BUCKET}" -input=false
    - terraform destroy -auto-approve -input=false
  tags:
    - private-vpc-runner
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"
      when: manual
    - when: never

terraform_destroy_infra:
  stage: destroy
  <<: *terraform_base
  script:
    - cd infra
    - terraform init -backend-config="bucket=${TF_STATE_BUCKET}" -input=false
    - terraform destroy -auto-approve -input=false
  needs:
    - job: terraform_destroy_config
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"
      when: manual
    - when: never
